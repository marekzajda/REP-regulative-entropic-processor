name: Bug report
description: Report a reproducible problem in REPNet Community Edition
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve REPNet Community Edition.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest code or command sequence that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, NumPy version, and relevant hardware details.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data check
      options:
        - label: I have not included credentials, private memory, private datasets, or machine-specific secrets.
          required: true
